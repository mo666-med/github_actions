name: github_actions

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  node-ci:
    uses: mo666-med/github-actions-node-ci/.github/workflows/node-ci-reusable.yml@v1
    with:
      node-version: '20'
      working-directory: '.'
      run-lint: true
      run-test: true
      run-build: true
      sheets-enabled: false
      sheets-spreadsheet-id: ''
      sheets-worksheet: 'Sheet1'
