name: github_actions

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - '**/.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-ci:
    uses: cursorvers/cursor-macbookpro2019-workflows/.github/workflows/node-ci-reusable.yml@v1
    with:
      node-version: '20'
      working-directory: '.'
      run-lint: true
      run-test: true
      run-build: true
      sheets-enabled: false
      sheets-spreadsheet-id: ''
      sheets-worksheet: 'Sheet1'
